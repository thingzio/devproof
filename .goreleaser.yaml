# Release build for the devproof CLI.
#
# A tool that exists to make other people's artifacts verifiable has to ship
# verifiably itself. Every release carries checksums, an SBOM per binary, a
# keyless signature over the checksum file, and build provenance attested by
# the workflow that produced it.
#
# Nothing here affects bundle bytes. Version and commit are stamped into the
# binary for diagnostics and provenance only: two DevProof releases packaging
# the same canonical tree must produce the same subject digest (DP-012).
version: 2

project_name: devproof

before:
  hooks:
    - go mod download
    - go mod verify

builds:
  - id: devproof
    main: ./cmd/devproof
    binary: devproof
    env:
      # No cgo: a static binary runs on whatever the runner has, and the
      # result does not depend on the build host's system libraries.
      - CGO_ENABLED=0
    flags:
      # Absolute paths in a binary leak the builder's filesystem layout and
      # make two builds of the same source differ.
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/thingzio/devproof/internal/version.version={{ .Version }}
      - -X github.com/thingzio/devproof/internal/version.commit={{ .FullCommit }}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    mod_timestamp: '{{ .CommitTimestamp }}'

archives:
  - id: devproof
    ids:
      - devproof
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - NOTICE
      - README.md
      - SECURITY.md

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

sboms:
  - id: archive-sboms
    artifacts: archive
    documents:
      - '${artifact}.spdx.json'

# There is deliberately no `signs:` block.
#
# Signing moved into thingzio/actions' release-go.yaml, which does it in a job
# holding no caller code -- the isolation that makes the provenance reach SLSA
# Build Level 3 rather than 2. That workflow passes --skip=sign, so a block
# here would not run at all: it would be a signature we believe we have and do
# not. release-go.yaml refuses to build if one is present, for that reason.
#
# What it does is unchanged: one keyless signature over checksums.txt, which
# already commits to every artifact by digest, delivered as a Sigstore bundle
# carrying the certificate and the Rekor inclusion proof together.

# Homebrew tap (cask). Publishes into the shared org-wide tap
# thingzio/homebrew-tap, so `brew install thingzio/tap/devproof` works.
#
# Guarded by HOMEBREW_DEPLOY_KEY: skip_upload is templated on the key so the
# cask is neither uploaded nor probed when the key is absent, and no cross-repo
# push is attempted until the secret exists. 'auto' additionally skips
# prereleases even when it does.
#
# A cask rather than a formula: these are prebuilt, signed binaries, and a
# formula would ask Homebrew to build from source -- which would produce a
# binary nobody attested to, from a project whose entire subject is provenance.
#
# Ordering note: the cask is pushed while the GitHub release is still a draft,
# because the release is only published after its signature verifies.
#
# That window used to be one job. Since releasing moved to the shared
# release-go.yaml it spans the rest of the build job, all of the attest job --
# which re-downloads every release asset, re-derives its digest, signs and
# attests -- and the scheduling latency between them, which nothing bounds.
# While it is open, `brew install thingzio/tap/devproof` resolves to a tag whose
# assets are not downloadable.
#
# Still the right trade against publishing an unverified release, but the fix
# when attest fails is to revert the cask commit in the tap, and that is now
# minutes rather than seconds of exposure.
homebrew_casks:
  - name: devproof
    repository:
      owner: thingzio
      name: homebrew-tap
      token: '{{ .Env.HOMEBREW_DEPLOY_KEY }}'
    homepage: https://github.com/thingzio/devproof
    description: Build, verify, and expand immutable OCI bundles
    skip_upload: '{{ if index .Env "HOMEBREW_DEPLOY_KEY" }}auto{{ else }}true{{ end }}'
    # The binaries are signed but not Apple-notarized, so Gatekeeper would
    # otherwise refuse to run them. Stripping the quarantine flag on install is
    # what makes a downloaded CLI usable without a right-click dance.
    #
    # Written through custom_block rather than hooks.post.install, because
    # Homebrew deprecated the raw `postflight` Ruby block that goreleaser emits
    # for that field and warns on every load of the cask -- four times during
    # one `brew install`. postflight_steps is a declarative DSL rather than a
    # rename, so the body could not simply be moved across.
    #
    # goreleaser gained hooks.post.install_steps for exactly this, but that
    # change is still an open pull request and no released version accepts the
    # field. Revisit when one does; this block is then deletable.
    #
    # The inner braces are escaped because goreleaser runs Go templating over
    # the whole rendered cask, and {{staged_path}} is Homebrew's own token,
    # resolved at install time rather than at release time.
    #
    # Removing the quarantine flag is a workaround for not notarizing. The
    # right fix is an Apple Developer ID and a notarized build; until then this
    # is a deliberate, visible trade rather than something to normalize away.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/devproof"]
        end
      end

snapshot:
  version_template: '{{ incpatch .Version }}-next'

changelog:
  use: github-native

release:
  # The release is created before it is signed, so it stays invisible until
  # release-go.yaml's attest job has verified the signature and its publish job
  # flips this. Without it there would be a public, unsigned release for the
  # length of the attest job.
  draft: true
  # GitHub does not return drafts when looking a release up by tag, so without
  # this a re-run cannot see the draft it made last time and opens a second one
  # for the same tag.
  use_existing_draft: true
  prerelease: auto
  footer: |
    ## Verifying this release

    Every artifact is covered by `checksums.txt`, which is signed with a
    Sigstore keyless signature. Verify the signature first, then the checksums:

    ```bash
    cosign verify-blob checksums.txt \
      --bundle checksums.txt.bundle \
      --certificate-identity-regexp '^https://github\.com/thingzio/actions/\.github/workflows/release-go\.yaml@' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com

    sha256sum --check --ignore-missing checksums.txt
    ```

    The signer is the shared build definition in `thingzio/actions`, not this
    repository. That is the SLSA Build Level 3 property made checkable: the
    signing identity lives in a job no code from this repository can reach.

    Build provenance is attested separately:

    ```bash
    gh attestation verify devproof_*_linux_amd64.tar.gz \
      --repo thingzio/devproof \
      --signer-workflow thingzio/actions/.github/workflows/release-go.yaml
    ```

    `--signer-workflow` is what distinguishes Level 3 from Level 2. Without it
    the check passes for provenance signed by any workflow in this repository.

    An SBOM in SPDX form accompanies each archive.
