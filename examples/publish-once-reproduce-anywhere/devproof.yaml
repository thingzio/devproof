# The publisher's intent: one source, pinned to a tag.
#
# A tag is a pointer, and a pointer can be moved. That is exactly why the lock
# beside this file exists -- `devproof lock` resolved this tag to a commit
# once, and every build from here on uses the commit, not the tag. If someone
# moves v0.5.0, a locked build fails rather than quietly packaging different
# content.
#
# Consumers need this file and devproof.lock.json. Nothing else: the source is
# fetched from a public URL at a pinned commit, so a rebuild needs no copy of
# the publisher's working directory and no trust in the publisher's machine.
apiVersion: devproof.thingz.io/v1alpha1
kind: Bundle

metadata:
  # Does not affect the digest. Two bundles with the same content and
  # different names are the same artifact.
  name: rack-baseline

spec:
  sources:
    - name: qualified-stack
      type: git
      mountPath: .

      config:
        url: https://github.com/thingzio/devproof.git
        ref: v0.5.0
        subPath: examples/firmware-catalog/catalog/gb200-nvl72-1.3.10
