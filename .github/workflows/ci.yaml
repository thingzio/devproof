name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A pull request that is force-pushed should not leave its previous run
# burning runners; the newest commit is the only one whose result matters.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: .go-version
          check-latest: true
      - id: versions
        uses: ./.github/actions/load-versions
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          version: ${{ steps.versions.outputs.golangci_lint }}
          args: --config .golangci.yaml
      - name: actionlint
        run: |
          go install "github.com/rhysd/actionlint/cmd/actionlint@${{ steps.versions.outputs.actionlint }}"
          actionlint
      - name: yamllint
        run: |
          pipx install "yamllint==${{ steps.versions.outputs.yamllint }}"
          yamllint --strict .
      # A missing license header is caught here rather than at review time.
      # The reference repositories enforce this by habit alone, which is why
      # a file eventually slips through.
      - name: license headers
        run: make license-check
      - name: go mod tidy is committed
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  # The determinism matrix from docs/testing.md. Byte-identical output across
  # every cell is the claim DevProof makes, so it is tested on every push
  # rather than saved for release day.
  #
  # Each cell runs the golden-vector tests, which assert exact bytes against
  # committed fixtures. That is what makes this a determinism matrix rather
  # than four independent test runs: identical fixture bytes on every
  # architecture is the claim, and a per-cell failure localizes which cell
  # broke it.
  #
  # The runner label and the platform it represents are both named, because
  # the mapping is not obvious — macos-latest is arm64, not amd64 — and a
  # label that silently changes architecture would quietly drop a cell.
  test:
    name: test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, platform: linux/amd64}
          - {os: ubuntu-24.04-arm, platform: linux/arm64}
          # macos-13 is the Intel runner. If GitHub ever repoints this label
          # at Apple silicon, the architecture assertion below fails loudly
          # rather than silently leaving darwin/amd64 untested.
          - {os: macos-13, platform: darwin/amd64}
          - {os: macos-latest, platform: darwin/arm64}
          # Windows is supported but not a release requirement, so it reports
          # without gating: a Windows-only failure must not block work on the
          # platforms that ship (DP-035).
          - {os: windows-latest, platform: windows/amd64, optional: true}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional || false }}
    steps:
      # Line endings are pinned by .gitattributes (`* -text`), so a Windows
      # checkout does not rewrite the fixtures whose digests the tests assert.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: .go-version
          check-latest: true
      - name: architecture matches the cell
        # A runner label that changed architecture underneath us would turn a
        # missing cell into a passing one, which is the failure this matrix
        # exists to prevent.
        if: runner.os != 'Windows'
        run: |
          want="$(echo '${{ matrix.platform }}' | cut -d/ -f2)"
          got="$(go env GOARCH)"
          echo "want ${want}, got ${got}"
          test "${want}" = "${got}"
      - name: test
        if: runner.os != 'Windows'
        run: make cover
      - name: test
        # make, sed, and the coverage plumbing are not dependable on a Windows
        # runner, and this job is here to prove the code works on Windows, not
        # to re-measure coverage.
        if: runner.os == 'Windows'
        run: go test ./...
      - name: upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5.0.0
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error

  # Golden bytes get their own job so a failure reads as "the format changed"
  # rather than hiding inside a general test failure (DP-015).
  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: .go-version
          check-latest: true
      - name: format golden vectors
        run: make test-golden

  # Determinism is a property of the artifact, not of a single run: build the
  # same fixtures twice under deliberately different ambient conditions and
  # require identical digests. See docs/testing.md "Determinism matrix".
  determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: .go-version
          check-latest: true
      # A -run pattern that matches nothing exits 0, so the pattern is
      # asserted before it is trusted: a silently empty determinism job is
      # worse than no determinism job.
      - name: the determinism pattern matches real tests
        run: |
          count="$(go test -list '${{ env.PATTERN }}' ./... | grep -c '^Test' || true)"
          echo "matched ${count} tests"
          test "${count}" -ge 5
        env:
          PATTERN: 'Deterministic|Golden|Canonical'
      - name: first pass
        env:
          TZ: UTC
          LANG: C
        run: |
          umask 022
          go test -count=1 -run 'Deterministic|Golden|Canonical' ./...
      - name: second pass under different ambient state
        env:
          TZ: Pacific/Kiritimati
          LANG: en_US.UTF-8
          SOURCE_DATE_EPOCH: '1700000000'
        run: |
          umask 077
          cd "$(mktemp -d)" && cd - >/dev/null
          go test -count=1 -run 'Deterministic|Golden|Canonical' ./...

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: .go-version
          check-latest: true
      # `make vuln` rather than govulncheck directly: the Makefile target holds
      # the documented allowlist for findings that are unfixable and
      # unreachable, and running the raw tool here meant CI and the local gate
      # disagreed about what "green" means -- which is the one thing the gate
      # exists to prevent.
      - name: govulncheck
        run: make vuln

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: .go-version
          check-latest: true
      - run: make build
      # Every release target must at least compile, including the ones no
      # cell in the test matrix runs on. Cross-compiling here is cheap and
      # catches a platform-specific build tag that the matrix would only
      # find at release time.
      - name: every release target compiles
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 \
                        windows/amd64 windows/arm64; do
            echo "building ${target}"
            GOOS="${target%%/*}" GOARCH="${target##*/}" go build ./...
            GOOS="${target%%/*}" GOARCH="${target##*/}" go vet ./...
          done
