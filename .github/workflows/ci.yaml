name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Neither a force-pushed pull request nor a run of pushes to main should leave
# older runs burning runners; the newest commit is the only one whose result
# matters.
#
# Keyed on the ref rather than the run id. github.head_ref is empty for a push,
# so falling back to github.run_id gave every push its own group and they
# queued behind one another instead of superseding -- which on a busy repo
# means waiting out a backlog to learn about the newest commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # Full history, for the secret scan below. `gitleaks git` walks the commit
      # graph, so under the default shallow clone it saw exactly one commit and
      # reported "no leaks found" -- a green check that proved nothing, which is
      # worse than not running it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: .go-version
          check-latest: true
      - id: versions
        uses: ./.github/actions/load-versions
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          version: ${{ steps.versions.outputs.golangci_lint }}
          args: --config .golangci.yaml
      - name: actionlint
        run: |
          go install "github.com/rhysd/actionlint/cmd/actionlint@${{ steps.versions.outputs.actionlint }}"
          actionlint
      - name: yamllint
        run: |
          pipx install "yamllint==${{ steps.versions.outputs.yamllint }}"
          yamllint --strict .
      # A missing license header is caught here rather than at review time.
      # The reference repositories enforce this by habit alone, which is why
      # a file eventually slips through.
      - name: license headers
        run: make license-check
      # A secret committed and then removed is still published: the object
      # stays reachable in the history, in every fork, and in every cache. The
      # only version of this check that helps runs before the push.
      - name: secrets
        run: make secrets
      - name: go mod tidy is committed
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  # The determinism matrix from docs/testing.md. Byte-identical output across
  # every cell is the claim DevProof makes, so it is tested on every push
  # rather than saved for release day.
  #
  # Three cells, chosen for what they can actually catch:
  #
  #   linux/amd64   the baseline
  #   linux/arm64   the architecture dimension
  #   darwin/arm64  the operating-system dimension
  #
  # Architecture is the cheap one to be confident about: every integer written
  # into a canonical byte stream goes through an explicit binary.BigEndian or
  # binary.LittleEndian, there is no cgo and no unsafe, so native word order
  # and alignment cannot reach the output. It is covered anyway, because
  # "cannot" is a claim worth testing, and a Linux arm64 runner is cheap.
  #
  # The operating system is where real differences live: APFS folds case and
  # ext4 does not, which is exactly what the path-collision rules exist for.
  #
  # darwin/amd64 is deliberately absent. Its architecture is covered by
  # linux/amd64 and its filesystem by darwin/arm64, so it only ever repeated
  # what two other cells already proved -- and it was the cell whose runner
  # label kept being retired.
  #
  # Every release target is still cross-compiled and vetted in the build job,
  # and goreleaser cross-compiles all four from one runner, so no architecture
  # ships untested for compilation.
  test:
    name: test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, platform: linux/amd64}
          - {os: ubuntu-24.04-arm, platform: linux/arm64}
          - {os: macos-latest, platform: darwin/arm64}
    runs-on: ${{ matrix.os }}
    # A runner label that no longer exists queues indefinitely instead of
    # failing. Without a timeout the run never completes and never reports,
    # which is worse than a red cell.
    timeout-minutes: 30
    steps:
      # Line endings are pinned by .gitattributes (`* -text`), so no checkout
      # rewrites the fixtures whose digests the tests assert.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: .go-version
          check-latest: true
      - name: architecture matches the cell
        # A runner label that changed architecture underneath us would turn a
        # missing cell into a passing one, which is the failure this matrix
        # exists to prevent.
        run: |
          want="$(echo '${{ matrix.platform }}' | cut -d/ -f2)"
          got="$(go env GOARCH)"
          echo "want ${want}, got ${got}"
          test "${want}" = "${got}"
      - name: test
        run: make cover-check
      - name: upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error

  # Golden bytes get their own job so a failure reads as "the format changed"
  # rather than hiding inside a general test failure (DP-015).
  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: .go-version
          check-latest: true
      - name: format golden vectors
        run: make test-golden

  # Determinism is a property of the artifact, not of a single run: build the
  # same fixtures twice under deliberately different ambient conditions and
  # require identical digests. See docs/testing.md "Determinism matrix".
  determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: .go-version
          check-latest: true
      # A -run pattern that matches nothing exits 0, so the pattern is
      # asserted before it is trusted: a silently empty determinism job is
      # worse than no determinism job.
      - name: the determinism pattern matches real tests
        run: |
          count="$(go test -list '${{ env.PATTERN }}' ./... | grep -c '^Test' || true)"
          echo "matched ${count} tests"
          test "${count}" -ge 5
        env:
          PATTERN: 'Deterministic|Golden|Canonical'
      - name: first pass
        env:
          TZ: UTC
          LANG: C
        run: |
          umask 022
          go test -count=1 -run 'Deterministic|Golden|Canonical' ./...
      - name: second pass under different ambient state
        env:
          TZ: Pacific/Kiritimati
          LANG: en_US.UTF-8
          SOURCE_DATE_EPOCH: '1700000000'
        run: |
          umask 077
          cd "$(mktemp -d)" && cd - >/dev/null
          go test -count=1 -run 'Deterministic|Golden|Canonical' ./...

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: .go-version
          check-latest: true
      # `make vuln` rather than govulncheck directly: the Makefile target holds
      # the documented allowlist for findings that are unfixable and
      # unreachable, and running the raw tool here meant CI and the local gate
      # disagreed about what "green" means -- which is the one thing the gate
      # exists to prevent.
      - name: govulncheck
        run: make vuln

  # Seed corpora already run under `make test`, deterministically. This job is
  # the part that was never running anywhere: actual fuzzing, which is the only
  # way a target finds an input nobody thought to write down.
  #
  # A failure here is a real defect rather than flakiness. Extraction is the
  # one place DevProof parses bytes it did not produce and has not yet proven
  # anything about, and a panic there is a denial of service in any process
  # embedding the SDK.
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: .go-version
          check-latest: true
      - name: fuzz smoke
        run: make fuzz
      # A crash leaves its input under testdata/fuzz. Keeping it is what turns
      # one unlucky CI run into a permanent regression test.
      - name: upload any crashers
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: fuzz-crashers
          path: |
            **/testdata/fuzz/**
          if-no-files-found: ignore

  # Two registries, because the interesting difference between them is a
  # feature one has and the other does not.
  #
  # Every other registry test drives an in-process handler written in this
  # repository, which proves the client does what we believe the distribution
  # specification says. That is a different claim from "it works against a
  # registry somebody else wrote", and the difference is where interoperability
  # bugs live -- this job found one: the evidence storage mode was reported as
  # "referrers" against a registry whose referrers endpoint returns 404,
  # because oras-go falls back on its own and returns success.
  #
  #   zot                  implements the referrers API
  #   distribution 2.8.3   predates it, so the fallback tag answers
  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: zot, image: "ghcr.io/project-zot/zot-linux-amd64:v2.1.10"}
          - {name: distribution, image: "registry:2.8.3"}
    services:
      registry:
        image: ${{ matrix.image }}
        ports: ['5000:5000']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: .go-version
          check-latest: true
      - name: wait for the registry
        run: |
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:5000/v2/ >/dev/null; then exit 0; fi
            sleep 1
          done
          echo "::error::${{ matrix.name }} did not become ready"
          exit 1
      - name: live registry round trip
        run: go test -tags registry -count=1 ./internal/oci/...
        env:
          DEVPROOF_TEST_REGISTRY: localhost:5000

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: .go-version
          check-latest: true
      - run: make build
      # Every release target must at least compile, including the ones no
      # cell in the test matrix runs on. Cross-compiling here is cheap and
      # catches a platform-specific build tag that the matrix would only
      # find at release time.
      - name: every release target compiles
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            echo "building ${target}"
            GOOS="${target%%/*}" GOARCH="${target##*/}" go build ./...
            GOOS="${target%%/*}" GOARCH="${target##*/}" go vet ./...
          done
