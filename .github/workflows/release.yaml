name: release

on:
  push:
    tags: ['v*']

# A release is not a place to discover that the tests fail, so the full gate
# runs again here against the exact tagged commit rather than trusting that CI
# passed on the branch it came from.
permissions:
  contents: read

jobs:
  # What a v* tag is allowed to mean.
  #
  # The workflow triggers on any tag matching v*, which is a wide door: a typo,
  # a personal tag, or a branch someone tagged locally would all publish a
  # release signed by this repository's identity. None of these checks is
  # expensive and each one refuses a different mistake.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: the tag is a semantic version
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::tag $tag is not a semantic version"
            exit 1
          fi
      - name: the tag is annotated and signed
        # Presence, not trust. A runner has no keyring, so `git verify-tag`
        # would fail for every tag including the good ones; what is checkable
        # here is that the tag is an annotated object carrying a signature
        # rather than a lightweight ref anybody could have pushed at any
        # commit. Who signed it is established by the key on the commit, which
        # is what a reviewer checks.
        run: |
          if [ "$(git cat-file -t "${GITHUB_REF_NAME}")" != "tag" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} is lightweight; releases are annotated and signed"
            exit 1
          fi
          if ! git cat-file tag "${GITHUB_REF_NAME}" | grep -q -- "-----BEGIN .* SIGNATURE-----"; then
            echo "::error::tag ${GITHUB_REF_NAME} carries no signature"
            exit 1
          fi
      - name: the tag is on main
        # A release built from a branch that was never reviewed is a release
        # whose contents nobody agreed to. Ancestry rather than equality: main
        # moves on after a tag.
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${GITHUB_REF_NAME}^{commit}" origin/main; then
            echo "::error::tag ${GITHUB_REF_NAME} is not an ancestor of main"
            exit 1
          fi

  # The same cells CI gates on. A release does not need one runner per shipped
  # target: goreleaser cross-compiles all four from a single machine, so an
  # architecture-specific runner buys running the tests there, nothing else.
  verify:
    name: verify (${{ matrix.platform }})
    needs: [gate]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - {os: ubuntu-latest, platform: linux/amd64}
          - {os: ubuntu-24.04-arm, platform: linux/arm64}
          - {os: macos-latest, platform: darwin/arm64}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: .go-version
          check-latest: true
      # The whole gate, not a subset. A release used to run the tests and the
      # conformance reader and skip lint, formatting, the tidy check, the
      # vulnerability and secret scans, and the coverage floor -- so the tag
      # most people install from was held to a lower standard than a pull
      # request.
      #
      # qualify-check rather than qualify: the mutating gate would repair the
      # tree and then pass, which on a tagged commit means passing against
      # bytes nobody is releasing.
      - name: qualify
        run: make qualify-check
      - name: conformance
        # The independent reader, run against the tagged tree. It shares no
        # code with the writer, so this is the check that the artifact matches
        # the specification rather than matching the code that produced it.
        run: go test ./pkg/conformance/...
      - name: fuzz smoke
        # Short and deterministic. A release is not where a long campaign
        # belongs, but a parser that crashes on its own seed corpus should not
        # reach a tag.
        run: make fuzz
        env:
          FUZZTIME: 20s

  # .versions.yaml stays authoritative for the tools that build a release.
  #
  # Without this the shared workflow falls back to thingzio/actions' own pins,
  # and the versions declared here would become documentation of something that
  # no longer happens -- `make sbom` would catalog with one syft and the release
  # with another, which is the drift .versions.yaml exists to prevent.
  #
  # cosign is deliberately not passed. The shared workflow holds it at >= v3.1.0
  # because below that cosign writes a Rekor entry type sigstore-go cannot
  # verify, and that constraint belongs with the code that depends on it.
  versions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      goreleaser: ${{ steps.read.outputs.goreleaser }}
      syft: ${{ steps.read.outputs.syft }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - id: read
        uses: ./.github/actions/load-versions

  # Building, signing, attesting and publishing all happen in the shared build
  # definition. This used to be three jobs here; the reason it is one call is
  # not tidiness.
  #
  # goreleaser runs this repository's own hooks. When the build and the OIDC
  # token live in the same job -- as they did here -- a hook could take the
  # token and mint provenance naming this workflow as the builder for bytes it
  # never produced. That is the forgery SLSA Build Level 3 excludes, and it is
  # why the old shape was Level 2: the certificate's Build Signer URI and Build
  # Config URI were both this file.
  #
  # In release-go.yaml the signing identity lives in a job that runs no code
  # from this repository at all, so Fulcio records thingzio/actions as the
  # signer and this repository as the entry point. Consumers verify with
  # --signer-workflow, which is the difference made checkable.
  #
  # Pinned by commit SHA, not by tag: a floating tag is a build definition
  # someone can move, which is the mutable-builder problem Level 3 exists to
  # exclude.
  release:
    needs: [verify, versions]
    permissions:
      contents: write
      # Granted to the called workflow, not used here. Only its attest job
      # receives it, and that job runs no code from this repository.
      id-token: write
      attestations: write
    uses: thingzio/actions/.github/workflows/release-go.yaml@368b3e12df4c41d9079b26e41a03efcd90461d56  # v1.7.1
    with:
      # Passed explicitly, not inherited. v1.7.0 changed this input's default
      # from .go-version to go.mod; both say 1.27.1 here so the result is the
      # same either way, but .go-version is what owns the toolchain in this
      # repository and a default that silently moved is not something to rely
      # on.
      go_version_file: .go-version
      goreleaser_version: ${{ needs.versions.outputs.goreleaser }}
      syft_version: ${{ needs.versions.outputs.syft }}
    secrets:
      # A fine-grained PAT with contents:write on thingzio/homebrew-tap.
      # Absent, .goreleaser.yaml skips the cask entirely rather than failing a
      # cross-repo push, so a release works before this is set.
      homebrew_deploy_key: ${{ secrets.HOMEBREW_DEPLOY_KEY }}
