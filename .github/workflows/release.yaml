name: release

on:
  push:
    tags: ['v*']

# A release is not a place to discover that the tests fail, so the full gate
# runs again here against the exact tagged commit rather than trusting that CI
# passed on the branch it came from.
permissions:
  contents: read

jobs:
  # Every platform a release ships binaries for, so a tag is never cut from
  # a commit that was only ever tested on half the matrix.
  verify:
    name: verify (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - {os: ubuntu-latest, platform: linux/amd64}
          - {os: ubuntu-24.04-arm, platform: linux/arm64}
          - {os: macos-15-intel, platform: darwin/amd64}
          - {os: macos-latest, platform: darwin/arm64}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: .go-version
          check-latest: true
      - name: test
        run: make cover
      - name: conformance
        # The independent reader, run against the tagged tree. It shares no
        # code with the writer, so this is the check that the artifact matches
        # the specification rather than matching the code that produced it.
        run: go test ./pkg/conformance/...

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Keyless signing exchanges this token for a Fulcio certificate. No
      # private key exists to leak, and the resulting certificate names the
      # workflow that produced the release.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: .go-version
          check-latest: true
      - id: versions
        uses: ./.github/actions/load-versions

      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2
        with:
          syft-version: ${{ steps.versions.outputs.syft }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94  # v7.2.3
        with:
          version: ${{ steps.versions.outputs.goreleaser }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Provenance attests what built the archives and from which source. It
      # is produced by the workflow rather than by the build, so a compromised
      # build step cannot forge it.
      - name: attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: 'dist/*.tar.gz'

      - name: verify the release signature
        # Verified here rather than assumed: a signature nobody checks is a
        # signature nobody knows is broken. This fails the release rather than
        # publishing artifacts whose signature does not verify.
        run: |
          cosign verify-blob dist/checksums.txt \
            --bundle dist/checksums.txt.bundle \
            --certificate-identity-regexp \
              "https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/release\.yaml@.*" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

  # goreleaser creates the release as a draft (`draft: true` in
  # .goreleaser.yaml) so a release is never published before its signature has
  # been verified above. Publishing is therefore a separate job -- without it
  # the release stays a draft forever, which is invisible to everyone but
  # repository collaborators and makes a repo with releases look like it has
  # none.
  #
  # This is the same gap that left 55 devradar releases unpublished. Added here
  # before the first tag rather than after.
  publish:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false
