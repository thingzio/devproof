name: release

on:
  push:
    tags: ['v*']

# A release is not a place to discover that the tests fail, so the full gate
# runs again here against the exact tagged commit rather than trusting that CI
# passed on the branch it came from.
permissions:
  contents: read

jobs:
  # The same cells CI gates on. A release does not need one runner per shipped
  # target: goreleaser cross-compiles all four from a single machine, so an
  # architecture-specific runner buys running the tests there, nothing else.
  verify:
    name: verify (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - {os: ubuntu-latest, platform: linux/amd64}
          - {os: ubuntu-24.04-arm, platform: linux/arm64}
          - {os: macos-latest, platform: darwin/arm64}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: .go-version
          check-latest: true
      - name: test
        run: make cover
      - name: conformance
        # The independent reader, run against the tagged tree. It shares no
        # code with the writer, so this is the check that the artifact matches
        # the specification rather than matching the code that produced it.
        run: go test ./pkg/conformance/...

  # .versions.yaml stays authoritative for the tools that build a release.
  #
  # Without this the shared workflow falls back to thingzio/actions' own pins,
  # and the versions declared here would become documentation of something that
  # no longer happens -- `make sbom` would catalog with one syft and the release
  # with another, which is the drift .versions.yaml exists to prevent.
  #
  # cosign is deliberately not passed. The shared workflow holds it at >= v3.1.0
  # because below that cosign writes a Rekor entry type sigstore-go cannot
  # verify, and that constraint belongs with the code that depends on it.
  versions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      goreleaser: ${{ steps.read.outputs.goreleaser }}
      syft: ${{ steps.read.outputs.syft }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - id: read
        uses: ./.github/actions/load-versions

  # Building, signing, attesting and publishing all happen in the shared build
  # definition. This used to be three jobs here; the reason it is one call is
  # not tidiness.
  #
  # goreleaser runs this repository's own hooks. When the build and the OIDC
  # token live in the same job -- as they did here -- a hook could take the
  # token and mint provenance naming this workflow as the builder for bytes it
  # never produced. That is the forgery SLSA Build Level 3 excludes, and it is
  # why the old shape was Level 2: the certificate's Build Signer URI and Build
  # Config URI were both this file.
  #
  # In release-go.yaml the signing identity lives in a job that runs no code
  # from this repository at all, so Fulcio records thingzio/actions as the
  # signer and this repository as the entry point. Consumers verify with
  # --signer-workflow, which is the difference made checkable.
  #
  # Pinned by commit SHA, not by tag: a floating tag is a build definition
  # someone can move, which is the mutable-builder problem Level 3 exists to
  # exclude.
  release:
    needs: [verify, versions]
    permissions:
      contents: write
      # Granted to the called workflow, not used here. Only its attest job
      # receives it, and that job runs no code from this repository.
      id-token: write
      attestations: write
    uses: thingzio/actions/.github/workflows/release-go.yaml@960a5cffeb70c09b4d9c4522186794cb126518e9  # v1.6.0
    with:
      goreleaser_version: ${{ needs.versions.outputs.goreleaser }}
      syft_version: ${{ needs.versions.outputs.syft }}
    secrets:
      # A fine-grained PAT with contents:write on thingzio/homebrew-tap.
      # Absent, .goreleaser.yaml skips the cask entirely rather than failing a
      # cross-repo push, so a release works before this is set.
      homebrew_deploy_key: ${{ secrets.HOMEBREW_DEPLOY_KEY }}
