---
name: codeql

# CodeQL runs from the shared thingzio/actions workflow. The visibility gate,
# the explicit build, and the vendoring handling all live there now -- see
# https://github.com/thingzio/actions/blob/main/.github/workflows/codeql-go.md

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  analyze:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: thingzio/actions/.github/workflows/codeql-go.yaml@960a5cffeb70c09b4d9c4522186794cb126518e9  # v1.6.0
    with:
      # .go-version owns the toolchain here, not .versions.yaml, so that
      # setup-go can read it without a YAML parser.
      go_version_file: .go-version
