# Single source of truth for every pinned tool and protocol version.
#
# Local development and CI MUST read from this file. A version that appears
# only in a Makefile recipe or only in a workflow step is a bug: the two drift,
# and "works on my machine" becomes unreproducible.
#
# The Go toolchain itself is owned by .go-version, not this file, so that
# actions/setup-go and `go` directive tooling can read it without a YAML parser.

# Build and release tooling.
build_tools:
  # renovate: datasource=github-releases depName=goreleaser/goreleaser
  goreleaser: 'v2.18.1'

# Quality gates. Numbers rather than tool versions, but they belong here for
# the same reason: a threshold that lives only in a Makefile recipe and a
# workflow step is a threshold the two will eventually disagree about.
quality:
  # The floor `make cover-check` enforces. Raise it as coverage improves;
  # never lower it to make a red build green.
  coverage_threshold: '75'

# Static analysis and formatting.
linting:
  # renovate: datasource=github-releases depName=golangci/golangci-lint
  golangci_lint: 'v2.13.2'
  # renovate: datasource=github-releases depName=rhysd/actionlint
  actionlint: 'v1.7.12'
  # renovate: datasource=pypi depName=yamllint
  yamllint: '1.38.0'

# Supply-chain and security scanning.
security_tools:
  # renovate: datasource=github-releases depName=anchore/grype
  grype: 'v0.118.0'
  # renovate: datasource=github-releases depName=anchore/syft
  syft: 'v1.51.1'
  # renovate: datasource=go depName=golang.org/x/vuln
  govulncheck: 'v1.8.0'
  # renovate: datasource=github-releases depName=gitleaks/gitleaks
  gitleaks: 'v8.30.1'

# Integration-test infrastructure. A moving tag would silently change what "a
# conformant registry" means between runs.
test_infra:
  # renovate: datasource=docker depName=ghcr.io/project-zot/zot
  zot: 'v2.1.9'
  # renovate: datasource=docker depName=registry
  registry: '3.0.0'
  # A registry from before the referrers API, which is the entire point of it.
  # Held deliberately: the value of this cell is the absence of the feature, so
  # an upgrade would silently delete the only test of the fallback tag path
  # (DP-028).
  registry_no_referrers: '2.8.3'

# External specification versions the format is written against. These are
# protocol pins, not dependency pins: changing one is a format compatibility
# decision, not a routine upgrade. See docs/README.md "Standards baseline".
specs:
  oci_image: 'v1.1.1'
  oci_distribution: 'v1.1.1'
  in_toto_attestation: 'v1.2.0'
  # Unicode tables that path canonicalization commits to. Frozen per DP-017;
  # a change here is a new bundle format version. Two independent data sets
  # must agree: golang.org/x/text/unicode/norm (NFC) and the standard
  # library's unicode package (simple case folding). TestUnicodeVersionIsPinned
  # asserts both against this value.
  unicode: '17.0.0'
